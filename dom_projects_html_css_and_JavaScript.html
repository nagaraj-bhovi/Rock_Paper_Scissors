<!DOCTYPE html>
<html>
  <head>
    <title>DOM Projects with HTML-CSS-JavaScript</title>

    <style>
      body{
        font-family: Arial;
      }
      .subscribe-button{
        border: none;
        background-color: black;
        color: white;
        text-align: center;
        border-radius: 50px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 15px;
        padding-right: 15px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 30px;
      }
      .is-subscribed{
        background-color: rgb(240, 240, 240);
        color: black;
        font-weight: bold;
      }
      .cost-input{
        font-size: 15px;
/*        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        */
        padding: 10px;
      }
      .calculate-button{
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding: 12px 15px;
        cursor: pointer;
      }

    </style>

  </head>
  <body>
    <p>YouTube Subscribe Button</p>
    <button onclick="
      subscribe();
      "class="js-Subscrib-button subscribe-button">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <input placeholder="Cost of order" class="js-cost-input cost-input" onkeydown="
    handleCostKeydown(event);
    ">
    <button onclick="
      calculateTotal();
    " class="calculate-button">Calculate</button>
    <p class="js-total-cost"></p>


    <script>
      //Automatic type conversion.
      String(25)
      console.log(25-5);
      console.log('25' + 5)// due this wrong ans we will not use the the strings while doing math operation. if we want to use first we need to conver the string into number using Number function then add.
      //Automatic type conversion.

      // Window
      // we dont have to type window, JavaScript will handle this since document, console, alert are the part of Window.
      window.document
      window.console.log('window');
      window.alert
      // Window

      function handleCostKeydown(event){
        console.log(event.key);
        if (event.key === 'Enter'){
          calculateTotal();
        }
      }

      function calculateTotal(){
        const inputElement = document.querySelector('.js-cost-input');
        let cost = Number(inputElement.value);
        if (cost < 40){
          cost += 10;
        }

        document.querySelector('.js-total-cost').innerHTML = `$${cost}`;

      }


      function subscribe(){
        const buttonElement = document.querySelector('.js-Subscrib-button');
        if (buttonElement.innerText === 'Subscribe'){
        buttonElement.innerHTML = 'Subscribed';
        buttonElement.classList.add('is-subscribed');
        }else{
          buttonElement.innerHTML = 'Subscribe';
          buttonElement.classList.remove('is-subscribed')
        }
      }
      
    </script>
  </body>
</html>
